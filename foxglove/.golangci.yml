version: "2"

linters:
  exclusions:
    # Restore golangci-lint v1 default exclusion presets.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # Suppress existing staticcheck findings so the Node 24 / golangci-lint v2
    # CI upgrade stays green. Follow up: fix these and remove the rules.
    rules:
      - linters:
          - staticcheck
        text: "ST1005:"
      - linters:
          - staticcheck
        text: "ST1006:"
      - linters:
          - staticcheck
        text: "QF1009:"
