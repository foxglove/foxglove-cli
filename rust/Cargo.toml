[package]
name = "foxglove-rust"
version = "1.0.33"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust compatibility implementation of the Foxglove CLI"

[[bin]]
name = "foxglove-rust"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.4", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_yaml_ng = { version = "=0.10.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
